<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表单与 input 类型 · WebDev Compass</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f7fa;
        color: #17283b;
        font:
          1rem/1.65 system-ui,
          sans-serif;
      }
      main {
        max-width: 54rem;
        margin: auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      section,
      fieldset,
      article {
        background: white;
        border: 1px solid #bbcbd7;
        border-radius: 0.65rem;
        padding: 1rem;
        margin: 1rem 0;
        min-width: 0;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      textarea,
      select,
      button {
        font: inherit;
        max-width: 100%;
        padding: 0.5rem;
        border: 1px solid #6f8191;
        border-radius: 0.3rem;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      button {
        background: #135776;
        color: white;
        cursor: pointer;
        margin: 0.3rem 0.3rem 0.3rem 0;
      }
      input[type="checkbox"],
      input[type="radio"] {
        inline-size: 1.1rem;
        block-size: 1.1rem;
      }
      label:has(input[type="checkbox"]),
      label:has(input[type="radio"]) {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 1rem;
        background: #e8eff5;
        border-radius: 0.4rem;
      }
      a {
        color: #075f83;
      }
      code {
        overflow-wrap: anywhere;
      }
      :focus-visible {
        outline: 3px solid #9c4600;
        outline-offset: 3px;
      }
      .hint {
        color: #46596a;
      }
      .error {
        color: #a02020;
        min-height: 1.7em;
      }
      svg,
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      dialog {
        max-width: min(32rem, 90vw);
        border: 1px solid #6f8191;
        border-radius: 0.6rem;
      }
      dialog:modal {
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: #10283a99;
        overflow: hidden;
        overscroll-behavior: contain;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a href="../../../notes/01-web-fundamentals/1.1-html/1.1.2.1.form.md"
          >返回对应笔记</a
        >
      </p>
      <h1>表单与 input 类型</h1>
      <p>
        观察原生表单如何收集有 name
        的字段。密码不回显，文件只显示名称，不会上传。
      </p>
      <form id="demo" action="#" method="post">
        <label for="nickname">昵称</label
        ><input
          id="nickname"
          name="nickname"
          autocomplete="nickname"
          value="小林"
          required
        />
        <label for="email">演示邮箱</label
        ><input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          value="demo@example.com"
          required
        />
        <label for="password">演示密码（不显示到结果）</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
        />
        <label for="quantity">数量（1–5）</label
        ><input
          id="quantity"
          name="quantity"
          type="number"
          min="1"
          max="5"
          value="2"
        />
        <fieldset>
          <legend>通知渠道，可多选</legend>
          <label
            ><input
              type="checkbox"
              name="channel"
              value="email"
              checked
            />邮件</label
          ><label
            ><input type="checkbox" name="channel" value="sms" />短信</label
          >
        </fieldset>
        <fieldset>
          <legend>账户类型，单选</legend>
          <label
            ><input
              type="radio"
              name="account"
              value="personal"
              checked
            />个人</label
          ><label><input type="radio" name="account" value="team" />团队</label>
        </fieldset>
        <label for="file">本地附件</label
        ><input id="file" name="attachment" type="file" />
        <input type="hidden" name="source" value="html-demo" />
        <p class="hint">
          hidden 只是不可见，不是秘密；每个同名 checkbox 作为独立条目保留。
        </p>
        <button type="submit">查看收集结果</button>
      </form>
      <pre id="result" aria-live="polite">提交后显示脱敏字段列表。</pre>
    </main>
    <script>
      document.querySelector("#demo").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const rows = [...data].map(([key, value]) => [
          key,
          key === "password"
            ? "（已隐藏）"
            : value instanceof File
              ? `${value.name || "未选择文件"} (${value.size} bytes)`
              : value,
        ]);
        document.querySelector("#result").textContent = JSON.stringify(
          rows,
          null,
          2,
        );
      });
    </script>
  </body>
</html>
