<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Worker：作用域、生命周期与离线回退 · 2.2.9</title><link rel="stylesheet" href="./assets/lab.css"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.9.service-worker-pwa.md">对应原理</a></p><h1>2.2.9 Service Worker：作用域、生命周期与离线回退</h1><section><p>只处理本组sw-sample.json，注册scope为当前2.2目录。不会提供全站离线壳，也不是完整PWA。</p><button id="register" type="button">注册并等待接管</button><button id="run" type="button">请求示例JSON</button><button id="clear" type="button">清理本例注册与缓存</button><p class="hint">先在线填充缓存，再仅让测试上下文离线。记录来源为network或cache；清理不触碰其他教材。</p></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
const expectedScope=new URL('./',location.href).href;const cacheName='webdev-stage2-browser-v1';async function ensureControl(){if(navigator.serviceWorker.controller)return;await new Promise((resolve,reject)=>{const done=()=>{if(navigator.serviceWorker.controller){clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',done);resolve()}};const timer=setTimeout(()=>{navigator.serviceWorker.removeEventListener('controllerchange',done);reject(new Error('未获得页面控制，请检查SW面板并重试'))},5000);navigator.serviceWorker.addEventListener('controllerchange',done);done()})}document.querySelector('#register').onclick=async()=>{try{if(!('serviceWorker'in navigator))throw new Error('当前环境不支持Service Worker');const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;await ensureControl();show({registered:true,controlled:!!navigator.serviceWorker.controller,scope:registration.scope})}catch(error){show({error:error.message})}};document.querySelector('#run').onclick=async()=>{try{const r=await fetch('./sw-sample.json');if(!r.ok)throw new Error('HTTP '+r.status);show({source:r.headers.get('X-Stage2-Source')||'network',body:await r.json(),controlled:!!navigator.serviceWorker.controller})}catch(error){show({error:error.message})}};document.querySelector('#clear').onclick=async()=>{try{const registrations=await navigator.serviceWorker.getRegistrations();const ours=registrations.filter(r=>r.scope===expectedScope);for(const registration of ours)await registration.unregister();await caches.delete(cacheName);show({cleaned:true,registrationsRemoved:ours.length,cacheRemoved:!(await caches.has(cacheName)),note:'当前页面controller可保留到页面离开；清理后刷新检查。'})}catch(error){show({error:error.message})}};
</script></body></html>
