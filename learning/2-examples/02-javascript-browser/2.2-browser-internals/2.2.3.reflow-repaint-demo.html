<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布局与绘制失效：避免交错读写造成布局抖动 · 2.2.3</title><link rel="stylesheet" href="./assets/lab.css"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.3.reflow-repaint.md">对应原理</a></p><h1>2.2.3 布局与绘制失效：避免交错读写造成布局抖动</h1><section><p>两种模式最终均将20个盒子加宽1px。页面只记录真实脚本耗时，不报告布局次数或FPS。</p><div id="rows" class="rows"></div><button id="interleaved" type="button">交错读写</button><button id="run" type="button">批量读后写</button><p class="hint">用Performance分别录制；一次耗时快慢不能证明普遍优劣。</p></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
const rows=document.querySelector('#rows');for(let i=0;i<20;i++){const box=document.createElement('div');rows.append(box)}function measure(mode){const boxes=[...rows.children];for(const box of boxes)box.style.width='100px';void rows.offsetWidth;const start=performance.now();if(mode==='interleaved'){for(const box of boxes){box.style.width=(box.offsetWidth+1)+'px';void box.offsetWidth}}else{const widths=boxes.map(b=>b.offsetWidth);boxes.forEach((b,i)=>b.style.width=(widths[i]+1)+'px')}const duration=performance.now()-start;show({mode,count:boxes.length,firstWidth:boxes[0].getBoundingClientRect().width,scriptDurationMs:duration,layoutCount:'not measured'})}document.querySelector('#run').onclick=()=>measure('batched');document.querySelector('#interleaved').onclick=()=>measure('interleaved');
</script></body></html>
