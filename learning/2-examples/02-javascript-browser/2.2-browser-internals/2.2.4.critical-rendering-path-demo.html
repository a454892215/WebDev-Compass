<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键渲染路径：先交付可见内容，再安排非关键资源 · 2.2.4</title><link rel="stylesheet" href="./assets/lab.css"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.4.critical-rendering-path.md">对应原理</a></p><h1>2.2.4 关键渲染路径：先交付可见内容，再安排非关键资源</h1><section><p>两个本地iframe拥有不同的真实资源依赖。计时来自各自Navigation/Resource Timing，不是生产LCP比较。</p><h2>基线：外部样式与阻塞脚本</h2><iframe id="baseline" title="阻塞依赖实验" src="./frames/critical-baseline.html"></iframe><h2>简化路径：关键样式内联、脚本defer</h2><iframe id="optimized" title="延后脚本实验" src="./frames/critical-optimized.html"></iframe><button id="run" type="button">读取两组实际条目</button></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
document.querySelector('#run').onclick=()=>{const report={};for(const id of ['baseline','optimized']){const frame=document.querySelector('#'+id);const nav=frame.contentWindow.performance.getEntriesByType('navigation')[0];report[id]={scriptReady:frame.contentDocument.documentElement.dataset.scriptReady==='yes',domContentLoadedMs:nav.domContentLoadedEventEnd,resources:frame.contentWindow.performance.getEntriesByType('resource').map(r=>({name:new URL(r.name).pathname,initiatorType:r.initiatorType,duration:r.duration}))}}show(report)};
</script></body></html>
