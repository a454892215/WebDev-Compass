<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP缓存：新鲜度、验证器与304 · 2.2.8</title><link rel="stylesheet" href="./assets/lab.css"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.8.item-2-2-8.md">对应原理</a></p><h1>2.2.8 HTTP缓存：新鲜度、验证器与304</h1><section><p>请关闭DevTools Disable cache。每次实验创建独立key，组内两次请求保持相同URL；服务器实际记录200/304。</p><button id="run" type="button">运行两种缓存策略</button><p class="hint">脚本可能看到200重建响应；真实网络304由服务端日志核对。不访问公网。</p></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
document.querySelector('#run').onclick=async()=>{const key=crypto.randomUUID();const all={};try{for(const mode of ['fresh','validate']){const url='/browser-fixture/cache?'+new URLSearchParams({mode,key});const responses=[];for(let i=0;i<2;i++){const r=await fetch(url);responses.push({scriptStatus:r.status,body:await r.json()})}const stats=await fetch('/browser-fixture/cache-stats?'+new URLSearchParams({mode,key})).then(r=>r.json());all[mode]={responses,serverStatuses:stats.statuses}}show(all)}catch(error){show({error:error.message});}};
</script></body></html>
