<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成与will-change：提示不是GPU加速开关 · 2.2.5</title><link rel="stylesheet" href="./assets/lab.css"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.5.will-change.md">对应原理</a></p><h1>2.2.5 合成与will-change：提示不是GPU加速开关</h1><section><p>提示、transform读数与实际GPU层是不同证据。只对当前目标准备，交互结束后清理提示。</p><div class="track"><div id="card">移动目标</div></div><button id="prepare" type="button">准备will-change</button><button id="run" type="button">移动／复位</button><button id="clear" type="button">立即清理提示</button></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
const card=document.querySelector('#card');let moved=false,timer;function report(){show({willChange:getComputedStyle(card).willChange,transform:getComputedStyle(card).transform,gpuLayer:'not measured'})}function clear(){clearTimeout(timer);card.style.willChange='auto';report()}document.querySelector('#prepare').onclick=()=>{card.style.willChange='transform';report()};document.querySelector('#run').onclick=()=>{moved=!moved;card.style.transform=moved?'translateX(40px)':'translateX(0px)';clearTimeout(timer);timer=setTimeout(clear,180)};document.querySelector('#clear').onclick=clear;window.addEventListener('pagehide',()=>clearTimeout(timer));report();
</script></body></html>
