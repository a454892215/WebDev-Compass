<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源提示：preload、prefetch与preconnect的边界 · 2.2.7</title><link rel="stylesheet" href="./assets/lab.css"><link rel="preload" href="./assets/hint.svg" as="image"><link rel="prefetch" href="./assets/prefetch-sample.json"><link rel="preconnect" href="http://127.0.0.1:4192"></head>
<body><main><p><a href="./README.md">实验目录</a> · <a href="../../../1-notes/02-javascript-browser/2.2-browser-internals/2.2.7.link-rel-preload.md">对应原理</a></p><h1>2.2.7 资源提示：preload、prefetch与preconnect的边界</h1><section><p>本页确实预加载并显示同一张SVG；prefetch可能被浏览器忽略，不把声明当成功。</p><img id="cover" src="./assets/hint.svg" width="640" height="240" alt="阅读队列由三张卡片组成"><button id="run" type="button">读取资源条目</button><p class="hint">这是同源本地实验，不能证明preconnect节省公网TLS时间。</p></section><h2>实际观察结果</h2><pre id="output" aria-live="polite">尚未操作。</pre><p class="hint">先预测再运行；页面结果与DevTools/真实设备证据分别记录。</p></main><script type="module">
const output=document.querySelector('#output');function show(value){output.textContent=JSON.stringify(value,null,2)}
document.querySelector('#run').onclick=()=>show({imageLoaded:document.querySelector('#cover').complete&&document.querySelector('#cover').naturalWidth>0,resources:performance.getEntriesByType('resource').filter(r=>/hint\.svg|prefetch-sample/.test(r.name)).map(r=>({name:new URL(r.name).pathname,initiatorType:r.initiatorType,duration:r.duration,transferSize:r.transferSize})),prefetchGuaranteed:false});
</script></body></html>
