<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>请求与文件实验</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #18253c;
        background: #f4f6fa;
      }
      main {
        width: min(100% - 2rem, 55rem);
        margin: 2rem auto;
      }
      section {
        background: white;
        padding: 1rem;
        border: 1px solid #b8c5d9;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }
      label {
        display: block;
        margin-top: 0.5rem;
      }
      input,
      button {
        font: inherit;
        min-height: 3rem;
        max-width: 100%;
        padding: 0.5rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
      }
      button {
        margin: 0.5rem 0;
      }
      a {
        color: #174cc4;
      }
      :focus-visible {
        outline: 3px solid #174cc4;
        outline-offset: 3px;
      }
      progress {
        max-width: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>请求与文件实验</h1>
      <p>仅loopback教学fixture，不保存上传文件。</p>
      <section>
        <h2>分页与响应校验</h2>
        <form id="search" action="/api/v1/items" method="get">
          <label for="q">标题查询</label><input id="q" name="q" type="search" /><button>
            查询
          </button>
        </form>
        <p id="status" role="status" aria-label="查询结果"></p>
        <ul id="items"></ul>
      </section>
      <section>
        <h2>原生上传进度</h2>
        <form
          id="upload"
          action="/api/upload"
          method="post"
          enctype="multipart/form-data"
        >
          <label for="file">文本文件（最多1024字节）</label
          ><input
            id="file"
            name="file"
            type="file"
            accept=".txt,text/plain"
            required
          /><button>上传校验</button>
        </form>
        <label for="progress">上传传输进度</label
        ><progress id="progress" max="100" value="0"></progress>
        <p id="upload-result" role="status" aria-label="上传结果"></p>
        <p>进度表示传输，不表示服务器校验或保存成功。</p>
      </section>
      <section>
        <h2>Blob下载</h2>
        <button id="download" type="button">准备下载</button>
        <p><a id="download-link" hidden download="sample.txt">下载公开示例</a></p>
      </section>
      <script type="module" src="./browser.mjs"></script>
    </main>
  </body>
</html>
