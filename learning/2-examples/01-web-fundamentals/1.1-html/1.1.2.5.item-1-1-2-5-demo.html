    <style>

      }
      body {
        margin: 0;
        background: #f4f7fa;
        color: #17283b;
        font:
          1rem/1.65 system-ui,

      main {
        max-width: 54rem;
        margin: auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      section,
      fieldset,
      article {
        background: white;
        border: 1px solid #bbcbd7;
        border-radius: 0.65rem;
        padding: 1rem;
        margin: 1rem 0;
        min-width: 0;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      textarea,
      select,
      button {
        font: inherit;
        max-width: 100%;
        padding: 0.5rem;
        border: 1px solid #6f8191;
        border-radius: 0.3rem;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      button {
        background: #135776;
        color: white;
        cursor: pointer;
        margin: 0.3rem 0.3rem 0.3rem 0;
      }
      input[type="checkbox"],
      input[type="radio"] {
        inline-size: 1.1rem;
        block-size: 1.1rem;
      }
      label:has(input[type="checkbox"]),
      label:has(input[type="radio"]) {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;

      a {

  <body>
    <main>
      <p>
        <a
          href="../../../1-notes/01-web-fundamentals/1.1-html/1.1.2.5.item-1-1-2-5.md"
          >返回对应笔记</a
        >
      </p>
      <h1>原生约束与自定义错误</h1>
      <p>
        提交时校验确认邮箱是否一致。错误解决后清除自定义约束，不在每次键入时播报错误。
      </p>
      <form id="demo" action="#" method="post">
        <label for="email">演示邮箱</label
        ><input
          id="email"
          name="email"
          type="email"
          value="demo@example.com"
          autocomplete="email"
          required
        />
        <label for="confirm">再次输入邮箱</label
        ><input
          id="confirm"
          name="confirm"
          type="email"
          value="other@example.com"
          autocomplete="email"
          required
          aria-describedby="confirm-help confirm-error"
        />
        <p id="confirm-help" class="hint">
          需要与上面的邮箱一致。输入时清除旧错误，提交时确认。
        </p>
        <p id="confirm-error" class="error"></p>
        <button type="submit">验证并预览</button>
      </form>
      <pre id="result" aria-live="polite">尚未通过验证。</pre>
    </main>
    <script>
      const form = document.querySelector("#demo"),
        email = document.querySelector("#email"),
        confirm = document.querySelector("#confirm"),
        error = document.querySelector("#confirm-error");
      function clearError() {
        confirm.setCustomValidity("");
        confirm.removeAttribute("aria-invalid");
        error.textContent = "";
      }
      email.addEventListener("input", clearError);
      confirm.addEventListener("input", clearError);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const mismatch = email.value !== confirm.value;
        confirm.setCustomValidity(mismatch ? "两次邮箱不一致。" : "");
        confirm.toggleAttribute("data-error", mismatch);
        if (mismatch) {
          confirm.setAttribute("aria-invalid", "true");
          error.textContent = "两次邮箱不一致，请修改确认邮箱。";
          confirm.reportValidity();
          confirm.focus();
          document.querySelector("#result").textContent =
            "未提交：请修正确认邮箱。";
          return;
        }
        clearError();
        document.querySelector("#result").textContent =
          "校验通过（本地预览，未发送数据）。";
      });
    </script>
  </body>
</html>
