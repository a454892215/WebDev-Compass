        "@context": "https://schema.org",

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;

        color: #17283b;
        font:
          1rem/1.65 system-ui,
          sans-serif;
      }
      main {
        max-width: 54rem;
        margin: auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      section,
      fieldset,
      article {
        background: white;
        border: 1px solid #bbcbd7;
        border-radius: 0.65rem;
        padding: 1rem;
        margin: 1rem 0;
        min-width: 0;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      textarea,
      select,
      button {
        font: inherit;
        max-width: 100%;
        padding: 0.5rem;
        border: 1px solid #6f8191;
        border-radius: 0.3rem;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      button {
        background: #135776;
        color: white;
        cursor: pointer;
        margin: 0.3rem 0.3rem 0.3rem 0;
      }
      input[type="checkbox"],
      input[type="radio"] {
        inline-size: 1.1rem;
        block-size: 1.1rem;
      }
      label:has(input[type="checkbox"]),
      label:has(input[type="radio"]) {
        display: flex;
        gap: 0.5rem;

  <body>
    <main>
      <p>
        <a href="../../../1-notes/01-web-fundamentals/1.1-html/1.1.3.6.seo.md"
          >返回对应笔记</a
        >
      </p>
      <h1>SEO 基础与结构化数据</h1>
      <p>
        本地演示用于检查文档语义与 JSON-LD
        一致性，不会发布，也不能验证真实搜索排名。
      </p>
      <article>
        <h2>HTML 表单入门</h2>
        <p>作者：WebDev Compass 编辑组</p>
        <p>本教程说明 label、name、原生校验和安全提交的基础规则。</p>
        <h3>先让内容可理解</h3>
        <p>
          标题、正文、链接和图片说明服务真实读者；不要隐藏关键词或虚构评价。
        </p>
      </article>
      <button id="inspect" type="button">检查本页 SEO 元信息</button>
      <pre id="result" aria-live="polite">
点击后读取 title、description 和 JSON-LD。</pre>
    </main>
    <script>
      document.querySelector("#inspect").addEventListener("click", () => {
        const schema = JSON.parse(
          document.querySelector('script[type="application/ld+json"]')
            .textContent,
        );
        document.querySelector("#result").textContent = JSON.stringify(
          {
            title: document.title,
            description: document.querySelector('meta[name="description"]')
              .content,
            h1: document.querySelector("h1").textContent,
            structuredData: schema,
          },
          null,
          2,
        );
      });
    </script>
  </body>
</html>
