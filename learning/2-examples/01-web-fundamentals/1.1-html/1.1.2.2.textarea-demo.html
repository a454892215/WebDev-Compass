<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择、分组与标签 · WebDev Compass</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f7fa;
        color: #17283b;
        font:
          1rem/1.65 system-ui,
          sans-serif;
      }
      main {
        max-width: 54rem;
        margin: auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      section,
      fieldset,
      article {
        background: white;
        border: 1px solid #bbcbd7;
        border-radius: 0.65rem;
        padding: 1rem;
        margin: 1rem 0;
        min-width: 0;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
      }
      input:not([type="checkbox"]):not([type="radio"]),
      textarea,
      select,
      button {
        font: inherit;
        max-width: 100%;
        padding: 0.5rem;
        border: 1px solid #6f8191;
        border-radius: 0.3rem;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      button {
        background: #135776;
        color: white;
        cursor: pointer;
        margin: 0.3rem 0.3rem 0.3rem 0;
      }
      input[type="checkbox"],
      input[type="radio"] {
        inline-size: 1.1rem;
        block-size: 1.1rem;
      }
      label:has(input[type="checkbox"]),
      label:has(input[type="radio"]) {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 1rem;
        background: #e8eff5;
        border-radius: 0.4rem;
      }
      a {
        color: #075f83;
      }
      code {
        overflow-wrap: anywhere;
      }
      :focus-visible {
        outline: 3px solid #9c4600;
        outline-offset: 3px;
      }
      .hint {
        color: #46596a;
      }
      .error {
        color: #a02020;
        min-height: 1.7em;
      }
      svg,
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      dialog {
        max-width: min(32rem, 90vw);
        border: 1px solid #6f8191;
        border-radius: 0.6rem;
      }
      dialog:modal {
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: #10283a99;
        overflow: hidden;
        overscroll-behavior: contain;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a
          href="../../../learning/1-notes/01-web-fundamentals/1.1-html/1.1.2.2.textarea.md"
          >返回对应笔记</a
        >
      </p>
      <h1>选择、分组与标签</h1>
      <p>先用键盘 Tab 遍历，再点击 label；辅助按钮不会触发表单提交。</p>
      <form id="demo" action="#" method="post">
        <label for="message">需求说明</label
        ><textarea id="message" name="message" rows="3" required>
希望学习原生 HTML。</textarea>
        <label for="topic">学习主题</label
        ><select id="topic" name="topic">
          <optgroup label="基础">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
          </optgroup>
          <optgroup label="工程"><option value="nuxt">Nuxt</option></optgroup>
        </select>
        <fieldset>
          <legend>学习时间</legend>
          <label
            ><input
              type="radio"
              name="time"
              value="morning"
              checked
            />上午</label
          ><label><input type="radio" name="time" value="evening" />晚上</label>
        </fieldset>
        <button id="fill" type="button">填入示例说明</button
        ><button type="submit">生成学习安排</button>
      </form>
      <pre id="result" aria-live="polite">尚未提交。</pre>
    </main>
    <script>
      document.querySelector("#fill").addEventListener("click", () => {
        document.querySelector("#message").value = "本周先完成 HTML 表单练习。";
        document.querySelector("#result").textContent =
          "辅助按钮只填入文字，没有提交。";
      });
      document.querySelector("#demo").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#result").textContent = JSON.stringify(
          [...new FormData(event.currentTarget)],
          null,
          2,
        );
      });
    </script>
  </body>
</html>
