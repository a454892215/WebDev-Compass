  <body>
    <main>
      <p>
        <a href="../../../learning/1-notes/01-web-fundamentals/1.1-html/1.1.3.1.canvas.md"
          >返回对应笔记</a
        >
      </p>
      <h1>Canvas 2D 与像素尺寸</h1>
      <p>
        同一份数据同时输出文本。高 DPI 通过扩大绘图缓冲区保持清晰，Canvas 不是
        DOM 图形树。
      </p>
      <label for="amount">练习完成度</label
      ><input id="amount" type="range" min="0" max="100" value="60" />
      <p id="summary" aria-live="polite">完成度 60%。</p>
      <canvas
        id="chart"
        width="640"
        height="240"
        role="img"
        aria-labelledby="summary"
        >完成度条形图；下方文字始终提供相同数据。</canvas
      >
      <p class="hint">
        绿色条长度对应上方百分比；没有 Canvas 支持时仍可阅读文字。
      </p>
      <pre id="metrics"></pre>
    </main>
    <script>
      const canvas = document.querySelector("#chart"),
        slider = document.querySelector("#amount");
      function draw() {
        const width = 640,
          height = 240,
          dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        document.querySelector("#summary").textContent =
          `完成度 ${slider.value}%。`;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          document.querySelector("#metrics").textContent =
            "当前环境无2D上下文，使用文字数据。";
          return;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#e1e9ef";
        ctx.fillRect(20, 60, 600, 90);
        ctx.fillStyle = "#087b69";
        ctx.fillRect(20, 60, (600 * Number(slider.value)) / 100, 90);
        document.querySelector("#metrics").textContent =
          `CSS逻辑尺寸 ${width}×${height}；缓冲区 ${canvas.width}×${canvas.height}；DPR ${dpr}`;
      }
      slider.addEventListener("input", draw);
      window.addEventListener("resize", draw);
      draw();
    </script>
  </body>
