  <body>
    <main>
      <p>
        <a
          href="../../../learning/1-notes/01-web-fundamentals/1.1-html/1.1.2.3.required.md"
          >返回对应笔记</a
        >
      </p>
      <h1>required、disabled 与 readonly</h1>
      <p>比较哪些字段参与 FormData，以及哪些约束会阻止提交。</p>
      <form id="demo" action="#" method="post">
        <label for="user">昵称（3–8 个英文字母）</label
        ><input
          id="user"
          name="user"
          value="Alice"
          required
          pattern="[A-Za-z]{3,8}"
          autocomplete="nickname"
          aria-describedby="user-help"
        />
        <p id="user-help" class="hint">
          placeholder 只是例子，规则必须明确可见。
        </p>
        <label for="locked">readonly 订单编号</label
        ><input id="locked" name="order" value="DEMO-42" readonly />
        <label for="disabled">disabled 服务端分配字段</label
        ><input id="disabled" name="server" value="不会被收集" disabled />
        <label for="amount">数量（1–10）</label
        ><input
          id="amount"
          name="amount"
          type="number"
          min="1"
          max="10"
          step="1"
          value="3"
          required
        />
        <button id="toggle" type="button">切换 disabled</button
        ><button type="submit">检查并收集</button>
      </form>
      <pre id="result" aria-live="polite">
订单字段会收集，disabled 字段不会收集。</pre>
    </main>
    <script>
      document.querySelector("#toggle").addEventListener("click", () => {
        const input = document.querySelector("#disabled");
        input.disabled = !input.disabled;
        document.querySelector("#result").textContent =
          `server.disabled = ${input.disabled}`;
      });
      document.querySelector("#demo").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#result").textContent = JSON.stringify(
          [...new FormData(event.currentTarget)],
          null,
          2,
        );
      });
    </script>
  </body>
</html>
