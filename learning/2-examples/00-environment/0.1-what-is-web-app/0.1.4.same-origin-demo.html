<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同源策略演示</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
      margin-top: 8px;
    }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    button:hover { opacity: 0.9; }
    #log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 6px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      min-height: 240px;
      margin-top: 12px;
    }
    .error { color: #f48771; }
    .success { color: #89d185; }
    .info { color: #6cb6ff; }
    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 8px;
    }
    th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }
  body { overflow-wrap: anywhere; } pre, #log { max-inline-size: 100%; overflow-x: auto; } :focus-visible { outline: 3px solid #7638a8; outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <h1>同源策略演示</h1>
  <p class="subtitle">对应笔记：<a href="../../../1-notes/00-environment/0.1-what-is-web-app/0.1.4.same-origin-policy.md">同源策略与跨域</a></p>

  <div class="card">
    <h2>当前页面的源（Origin）</h2>
    <table>
      <tr><th>协议</th><td id="origin-protocol"></td></tr>
      <tr><th>域名</th><td id="origin-host"></td></tr>
      <tr><th>端口</th><td id="origin-port"></td></tr>
      <tr><th>完整源</th><td id="origin-full"><code></code></td></tr>
    </table>
  </div>

  <div class="card">
    <h2>实验：发起请求并观察结果</h2>
    <p style="font-size:14px;color:#666;margin-bottom:4px">
      打开 DevTools → <strong>Console</strong> 查看完整错误信息。
    </p>
    <button class="success" id="btn-same">同源 HTTP 请求</button>
    <button class="danger" id="btn-cross">跨源无许可（预期不可读）</button>
    <button id="btn-allowed">跨源且允许 CORS</button>
    <button id="btn-clear">清空日志</button>
    <div id="log"></div>
  </div>

  <script>
    const log = document.getElementById('log');

    // 显示当前源信息
    document.getElementById('origin-protocol').textContent = location.protocol;
    document.getElementById('origin-host').textContent = location.hostname || '(空 — file:// 协议)';
    document.getElementById('origin-port').textContent = location.port || '(默认端口)';
    document.getElementById('origin-full').querySelector('code').textContent = location.origin || 'null (file:// 协议无 origin)';

    function appendLog(text) { log.textContent += text + '\n'; }
    appendLog('按阶段 0 README 启动双端口服务；请通过 127.0.0.1 页面源访问。');
    const crossPort = new URLSearchParams(location.search).get('crossPort') || '4181';
    const cross = new URL(location.href); cross.port = crossPort;
    async function run(url) {
      appendLog(`请求 ${url}；是否同源：${new URL(url, location.href).origin === location.origin}`);
      try { const res = await fetch(url); if (!res.ok) throw new Error(`HTTP ${res.status}`); appendLog(`可读响应 ${res.status}：${JSON.stringify(await res.json())}`); }
      catch (error) { appendLog(`请求/读取失败：${error.message}。结合 Network 与 Console 区分 CORS、连接失败和 HTTP；仅凭 TypeError 不能判因。`); }
    }
    document.getElementById('btn-same').onclick=()=>run('/stage0-api/users/1');
    document.getElementById('btn-cross').onclick=()=>run(new URL('/stage0-api/cors-denied', cross).href);
    document.getElementById('btn-allowed').onclick=()=>run(new URL('/stage0-api/cors-allowed', cross).href);
    document.getElementById('btn-clear').onclick=()=>{ log.textContent=''; };
  </script>
</main>
</body>
</html>
